# DozLab's controller, its RBAC and the LabSession CRD, from the dozlab chart.
# The image tags are written by Flux image automation (images.yaml): the comment after each one
# names the ImagePolicy that sets it. Edit anything else here; leave the tags to Flux.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dozlab
  namespace: dozlab-system
spec:
  interval: 10m
  releaseName: dozlab
  chartRef:
    kind: OCIRepository
    name: dozlab-chart
  # No install remediation on purpose: it uninstalls a failed install, and this release adopts
  # the controller that was running before Flux (dozlab-infra helm/dozlab/README.md, "Adopting
  # an existing install"). A failed install is left in place to look at.
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    crds:
      install: true
    # The API still runs on the host behind the Funnel; it moves in next (dozlab-api
    # docs/decision.md, "CI on GitHub Actions, CD with Flux and the dozlab Helm chart").
    api:
      enabled: false
    controller:
      # The Deployment's selector from before the chart; it can't change.
      selectorLabels:
        app: dozlab-controller
      image:
        repository: ghcr.io/dozlab/dozlab-controller
        tag: main-fd71de5-5 # {"$imagepolicy": "flux-system:dozlab-controller:tag"}
      labPod:
        vmImage: ghcr.io/dozlab/dozlab-firecracker:main-04aee60-2 # {"$imagepolicy": "flux-system:dozlab-firecracker"}
        # Default for labs without their own init image (labs.init_image in the API's database)
        initImage: ghcr.io/dozlab/dozlab-init-vm:main-74f0aaf-2 # {"$imagepolicy": "flux-system:dozlab-init-vm"}
        terminalImage: ghcr.io/dozlab/dozlab-terminal:main-f708f26-4 # {"$imagepolicy": "flux-system:dozlab-terminal"}
        ingressMiddleware: default-dozlab-strip-session-prefix@kubernetescrd
        publicBaseURL: https://dozmanlab.taildc994d.ts.net
        # Private dozlab-terminal; ghcr-pull is written by ESO (secrets/).
        imagePullSecrets:
          - ghcr-pull
