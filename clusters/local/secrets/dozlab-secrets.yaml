# DozLab's secrets (dozlab-infra helm/dozlab-secrets): the locked-down dozlab-secrets namespace
# holding the values, the reader account, ESO's ClusterSecretStore (Kubernetes provider) and the
# ExternalSecrets. Needs ESO's CRDs. Values are set by hand once (chart README, "Setting a value").
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: dozlab-secrets-chart
  namespace: flux-system
spec:
  interval: 10m
  url: oci://ghcr.io/dozlab/charts/dozlab-secrets
  ref:
    semver: ">=0.1.0 <1.0.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dozlab-secrets
  namespace: flux-system
spec:
  interval: 10m
  releaseName: dozlab-secrets
  dependsOn:
    - name: external-secrets
  chartRef:
    kind: OCIRepository
    name: dozlab-secrets-chart
  values:
    ghcrPull:
      namespaces:
        - default
        - flux-system
