# External Secrets Operator: copies secrets from OpenBao into Kubernetes Secrets.
# Installed before dozlab-secrets, which needs its CRDs (dependsOn).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 24h
  url: https://charts.external-secrets.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 30m
  releaseName: external-secrets
  targetNamespace: external-secrets
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: external-secrets
      version: 2.12.0
      sourceRef:
        kind: HelmRepository
        name: external-secrets
  values:
    installCRDs: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
    webhook:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
    certController:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
